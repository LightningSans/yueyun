server:
  port: 8080

spring:
  application:
    name: yuexuan-mall
  profiles:
    active: dev

  # ─── Jackson 配置 ───
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # ─── 控制台彩色日志输出 ───
  output:
    ansi:
      enabled: always

  # ─── 文件上传 ───
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# ─── Spring AI — DeepSeek（OpenAI 兼容协议） ───

  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
          max-tokens: 4096

# ─── DashScope 配置（保留兼容，可删除） ───
dashscope:
  model: deepseek-v4-pro
